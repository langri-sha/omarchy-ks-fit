[workspace]
resolver = "3"
members = [ "daemon" ]

  [workspace.package]
  edition = "2024"
  authors = [ "Filip Dupanović <filip.dupanovic@gmail.com>" ]
  license = "MIT"
  publish = false
  repository = "https://github.com/langri-sha/omarchy-ks-fit"
  rust-version = "1.89"
  version = "0.1.0"

  [workspace.dependencies]
  anyhow = "1.0.104"
  futures-util = "0.3.34"
  jiff = "0.2.37"
  log = "0.4.34"
  serde_json = "1.0.151"
  thiserror = "2.0.21"

    [workspace.dependencies.bluer]
    version = "0.17.4"
    features = [ "bluetoothd" ]

    [workspace.dependencies.rusqlite]
    version = "0.40.2"
    features = [ "bundled" ]

    [workspace.dependencies.serde]
    version = "1.0.229"
    features = [ "derive" ]

    [workspace.dependencies.tokio]
    version = "1.53.2"
    features = [
  "io-std",
  "io-util",
  "macros",
  "rt",
  "signal",
  "sync",
  "time"
]

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
strip = true
